<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style> 
    body{
        background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #cb7404ed;
            font-family: sans-serif;
            min-height: 100vh;
            margin: 0;
    }
    .link {
        font-weight: bold;
        text-decoration: none;
        color: #ff004c;
        padding: 5px 10px;
        transition: 0.3s;
        font-size: 32px;
    }
    p {
        font-size: 18px;
        margin: 10px 0;
    }
    .link:hover {
        color: #04ff0c;
        text-shadow: 0 0 10px #ff0019;
    }
    .gradient-text {
        font-size: 48px;
        background: linear-gradient(90deg, #FFD700, #FF6B6B, #FF8C00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
        padding: 20px 0;
    }   
</style>
</head>
<body>

    <h1 class="gradient-text">Web Page</h1>
    <p><a href="anchor.html" class="link">Go to News Headlines</a></p><br>
    <p><a href="https://www.google.com" class="link">Google</a></p>
</body>
</html>
