<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-32">
    <title>3D Subway Surfer - Jetpack Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Arial', sans-serif; }
        #game-ui { position: absolute; top: 20px; left: 20px; color: #FFF; z-index: 10; pointer-events: none; }
        .stat-box { background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 10px; margin-bottom: 5px; border-left: 5px solid #f1c40f; }
        #score-val { color: #f1c40f; font-size: 24px; font-weight: bold; }
        #powerup-ui { color: #00ff00; font-weight: bold; display: none; }
        #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); color: white; padding: 40px; text-align: center; border-radius: 20px; display: none; z-index: 20; border: 4px solid #f1c40f; }
        button { background: #f1c40f; border: none; padding: 15px 30px; font-size: 20px; cursor: pointer; font-weight: bold; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="game-ui">
        <div class="stat-box">SCORE: <span id="score-val">0</span></div>
        <div id="powerup-ui" class="stat-box">🚀 JETPACK ACTIVE!</div>
    </div>

    <div id="game-over">
        <h1>GAME OVER! 😵</h1>
        <p>Final Score: <span id="final-score">0</span></p>
        <button onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, player;
        let obstacles = [], coins = [], powerups = [];
        let score = 0, isRunning = true, currentLane = 0;
        let isJumping = false, jumpVel = 0, gravity = 0.015;
        let isJetpack = false, jetpackTimer = 0;
        const laneWidth = 3.5, speed = 1.0;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 8, 14);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            let sun = new THREE.DirectionalLight(0xffffff, 1);
            sun.position.set(5, 15, 5);
            scene.add(sun);

            // Ground
            let ground = new THREE.Mesh(new THREE.PlaneGeometry(15, 5000), new THREE.MeshPhongMaterial({color: 0x333333}));
            ground.rotation.x = -Math.PI/2;
            scene.add(ground);

            // Player
            player = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshPhongMaterial({color: 0x3498db}));
            player.position.y = 1;
            scene.add(player);

            window.addEventListener('keydown', (e) => {
                if(!isRunning) return;
                if((e.key === 'a' || e.key === 'ArrowLeft') && currentLane > -1) currentLane--;
                if((e.key === 'd' || e.key === 'ArrowRight') && currentLane < 1) currentLane++;
                if(e.code === 'Space' && !isJumping && !isJetpack) { isJumping = true; jumpVel = 0.35; }
            });
            animate();
        }

        function spawn() {
            if(!isRunning) return;
            let lane = Math.floor(Math.random()*3) - 1;
            
            // Spawn Long Train
            if(Math.random() < 0.03) {
                let train = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 20), new THREE.MeshPhongMaterial({color: 0x2c3e50}));
                train.position.set(lane * laneWidth, 2, -150);
                train.type = "train";
                scene.add(train); obstacles.push(train);
            }
            // Spawn Jetpack Powerup (Green Box)
            else if(Math.random() < 0.005) {
                let jet = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshPhongMaterial({color: 0x00ff00}));
                jet.position.set(lane * laneWidth, 1.5, -150);
                scene.add(jet); powerups.push(jet);
            }
            // Spawn Coins
            else if(Math.random() < 0.1) {
                let coin = new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.2,16), new THREE.MeshPhongMaterial({color: 0xFFD700}));
                coin.rotation.x = Math.PI/2;
                coin.position.set(lane * laneWidth, isJetpack ? 10 : 1.5, -150);
                scene.add(coin); coins.push(coin);
            }
        }

        function animate() {
            if(!isRunning) return;
            requestAnimationFrame(animate);
            spawn();

            score += 1; // Continuous score
            document.getElementById('score-val').innerText = score;

            // Lane movement
            player.position.x += (currentLane * laneWidth - player.position.x) * 0.2;

            // Jetpack Logic
            if(isJetpack) {
                player.position.y += (10 - player.position.y) * 0.1;
                jetpackTimer--;
                if(jetpackTimer <= 0) {
                    isJetpack = false;
                    document.getElementById('powerup-ui').style.display = 'none';
                }
            } else {
                // Gravity & Jumping
                if(isJumping) {
                    player.position.y += jumpVel;
                    jumpVel -= gravity;
                }

                // TRAIN SURFING LOGIC (Train ke upar chalna)
                let onTrain = false;
                obstacles.forEach(t => {
                    if(Math.abs(player.position.x - t.position.x) < 1.5 && 
                       Math.abs(player.position.z - t.position.z) < 10 && 
                       player.position.y >= 3.8) {
                        player.position.y = 5; // Stay on top
                        isJumping = false;
                        jumpVel = 0;
                        onTrain = true;
                    }
                });

                if(!onTrain && player.position.y > 1 && !isJumping) {
                    player.position.y -= 0.2; // Fall off train
                }
                if(player.position.y < 1) player.position.y = 1;
            }

            // Move & Collide Obstacles
            obstacles.forEach((obj, i) => {
                obj.position.z += speed;
                if(Math.abs(player.position.x - obj.position.x) < 1.4 && 
                   Math.abs(player.position.z - obj.position.z) < 10 && 
                   player.position.y < 3.5) {
                    isRunning = false;
                    document.getElementById('game-over').style.display = 'block';
                    document.getElementById('final-score').innerText = score;
                }
                if(obj.position.z > 20) { scene.remove(obj); obstacles.splice(i, 1); }
            });

            // Powerup Collection
            powerups.forEach((p, i) => {
                p.position.z += speed;
                if(player.position.distanceTo(p.position) < 2) {
                    isJetpack = true;
                    jetpackTimer = 500;
                    document.getElementById('powerup-ui').style.display = 'block';
                    scene.remove(p); powerups.splice(i,1);
                }
            });

            // Coins
            coins.forEach((c, i) => {
                c.position.z += speed;
                if(player.position.distanceTo(c.position) < 2) {
                    score += 100;
                    scene.remove(c); coins.splice(i, 1);
                }
            });

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
