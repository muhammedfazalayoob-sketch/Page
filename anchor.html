            margin: 0;
    }
    h1 {
        text-align: center;
    }
    .link {
        font-weight: bold;
        text-decoration: none;
        color: #a200ff;
        padding: 5px 10px;
        transition: 0.3s;
        font-size: 30px;
    }
    .link:hover {
        color: #88ff00;
        text-shadow: 0 0 10px #ff0000;
    }
    .gradient-text {
        font-size: 48px;
        background: linear-gradient(90deg, #FFD700, #FF6B6B, #FF8C00);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
        padding: 20px 0;
    }   
</style>
