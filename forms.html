<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

    <h1>html forms</h1>
    <form >
        <fieldset>
            <legend>Personal Information</legend>
            <label for="name">Name</label>
            <input id ="name" name="name" type="text" placeholder="Full Name" required>

            <br>
            <label for="fname">Father Name</label>
            <input id="fname" name="fname" type="text" placeholder="Father Name" required>

            <br>
            <label for="age">Age</label>
            <input type="number" id="age" name="age" min="1" max="70">

            <br>
            <label for="date">Date of birth</label>  
            <input type="date" id="date" name="date">

            <br>
            <label ><input type="radio" name="gender">Male</label>
            <label><input type="radio" name="gender">Female</label>
            <label><input type="radio" name="gender">Other</label>

            <pre>Select your hobbies</pre>
            <label ><input type="checkbox" name="coding" value="coding" >Coding</label>
            <label ><input type="checkbox" name="sweeping" value="sweeping">Sweeping</label> 
            <label ><input type="checkbox" name="playing">Playing</label>
        </fieldset>
        <br>

        <fieldset>
            <legend>Account Details</legend>
            <label for="email">Email</label>
            <input id="email" name="email" type="text" placeholder="user@example.com" required>

            <br>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="password" required>
        </fieldset>
        <br>

        <fieldset>
            <legend>Appointment</legend>
            <label for="appt">Choose an appointment time:</label>
            <input type="time" id="appt" name="appt" min="09:00" max="18:00" required >
            <!-- <br> -->
            <!-- <label for="search">Search</label> -->
            <!-- <input type="search" name="search" id="search" placeholder="search..."> -->
            <br>
            <label for="dt">Date time</label>
            <input type="datetime-local" name="dt" id="dt">
        </fieldset>

        <br>
        <fieldset>
            <legend>Other Information</legend>
            <label for="website">Website</label>
            <input type="url" id="website" name="website" placeholder="https://example.com">
            <br>

            <label for="color">Favorite color</label>
            <input type="color" id="color" name="color" value="#ff0000">
        </fieldset>
        <br>

        <fieldset>
            <legend>Documents</legend>
            <label for="resume">Resume</label>
            <input type="file" name="resume" id="resume" multiple >

            <br>
            <label for="image">Profile Image</label>
            <input type="file" id="image" name="image">
        </fieldset>
        <br>
        <fieldset>
            <legend>Rating</legend>
            <label for="rating">Rate this form:</label>
            <input type="range" id="rating" name="rating" min="0" max="10" value="2">
        </fieldset>
    <button type="submit">Submit</button>
    <button type="reset">CLick to reset</button>
    <button type="button">Button</button>
    </form>
</body>
</html>
